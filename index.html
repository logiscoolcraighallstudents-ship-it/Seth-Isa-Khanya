<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Highway Riders 3D</title>
    <!-- Tailwind CSS for UI overlays -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #05050a;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .neon-text {
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.7), 0 0 20px rgba(0, 243, 255, 0.5);
        }
        .neon-box {
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3), inset 0 0 15px rgba(0, 243, 255, 0.2);
            border: 2px solid rgba(0, 243, 255, 0.6);
        }
        .neon-box-pink {
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.4), inset 0 0 15px rgba(255, 0, 127, 0.2);
            border: 2px solid rgba(255, 0, 127, 0.8);
        }
        .scanline {
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0, 0, 0, 0.3) 50%, rgba(0, 0, 0, 0.3));
            background-size: 100% 4px;
        }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden text-white">

    <!-- Three.js Canvas Container -->
    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <!-- Scanline overlay for retro arcade feel -->
    <div class="absolute inset-0 z-10 pointer-events-none scanline opacity-40"></div>

    <!-- MAIN MENU SCREEN -->
    <div id="menu-screen" class="absolute inset-0 z-20 flex flex-col items-center justify-center bg-black/85 backdrop-blur-md transition-opacity duration-500">
        <div class="text-center max-w-xl px-6">
            <h1 class="text-6xl md:text-7xl font-black tracking-wider text-cyan-400 neon-text mb-2">NEON RIDERS</h1>
            <p class="text-sm md:text-base text-pink-500 tracking-widest uppercase mb-10">Cyberpunk Highway 3D Arcade</p>

            <!-- Vehicle Selector -->
            <div class="mb-8">
                <p class="text-xs text-gray-400 uppercase tracking-widest mb-4">Select Your Ride</p>
                <div class="flex justify-center gap-6">
                    <button id="select-car" onclick="selectVehicle('car')" class="neon-box px-8 py-4 rounded-xl bg-cyan-950/40 hover:bg-cyan-900/60 transition transform hover:scale-105 flex flex-col items-center group">
                        <svg class="w-12 h-12 text-cyan-400 mb-2 group-hover:animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span class="font-bold text-lg text-cyan-300">SPORTS CAR</span>
                        <span class="text-xs text-gray-400 mt-1">Sturdy & Balanced</span>
                    </button>
                    <button id="select-bike" onclick="selectVehicle('bike')" class="neon-box-pink px-8 py-4 rounded-xl bg-pink-950/40 hover:bg-pink-900/60 transition transform hover:scale-105 flex flex-col items-center group">
                        <svg class="w-12 h-12 text-pink-400 mb-2 group-hover:animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        <span class="font-bold text-lg text-pink-300">MOTORCYCLE</span>

            <button onclick="startGame()" class="w-full max-w-xs mx-auto py-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-black font-black text-xl rounded-xl shadow-[0_0_25px_rgba(0,243,255,0.6)] transform hover:scale-105 transition active:scale-95">
                START ENGINE

                <p><span class="text-pink-400">SPACEBAR</span> or <span class="text-pink-400">UP ARROW</span> for Nitro Boost</p>
            </div>
        </div>

    <!-- HUD / GAMEPLAY SCREEN -->

        <!-- Top HUD -->
        <div class="flex justify-between items-start">
            <div class="neon-box bg-black/60 px-6 py-3 rounded-xl backdrop-blur-sm">
                <div class="text-xs text-cyan-400 uppercase tracking-widest">Score</div>

            <div class="flex gap-4">

                    <div class="text-xs text-yellow-400 uppercase tracking-widest">Coins</div>
                    <div id="hud-coins" class="text-3xl font-black text-yellow-300">0</div>
                </div>
                <div class="neon-box-pink bg-black/60 px-6 py-3 rounded-xl backdrop-blur-sm text-center">
                    <div class="text-xs text-pink-400 uppercase tracking-widest">Nitro</div>
                    <div class="w-24 bg-gray-800 h-3 rounded-full mt-2 overflow-hidden border border-pink-500/50">

                    </div>

                <button onclick="toggleSound()" id="sound-btn" class="neon-box bg-black/60 px-4 py-2 rounded-lg text-xs text-cyan-400 hover:bg-cyan-950 transition">AUDIO: ON</button>
                <button onclick="pauseGame()" class="neon-box bg-black/60 px-4 py-2 rounded-lg text-xs text-cyan-400 hover:bg-cyan-950 transition">PAUSE</button>
            </div>
            <div class="neon-box bg-black/70 px-8 py-4 rounded-2xl backdrop-blur-md text-center">
                <div class="text-xs text-gray-400 uppercase tracking-widest">Velocity</div>
                <div class="flex items-baseline justify-center gap-1">
                    <span id="hud-speed" class="text-5xl font-black text-cyan-400 neon-text">120</span>
                    <span class="text-xs text-cyan-200 font-bold">KM/H</span>
                </div>
            </div>
        </div>
    </div>

    <!-- PAUSE MENU -->
    <div id="pause-screen" class="absolute inset-0 z-30 hidden flex flex-col items-center justify-center bg-black/80 backdrop-blur-md">
        <div class="neon-box bg-black/90 p-8 rounded-2xl text-center max-w-sm w-full">
            <h2 class="text-3xl font-black text-cyan-400 mb-6 neon-text">GAME PAUSED</h2>
            <div class="space-y-4">
                <button onclick="resumeGame()" class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-black font-bold rounded-xl transition">RESUME</button>
                <button onclick="restartGame()" class="w-full py-3 bg-gray-800 hover:bg-gray-700 text-cyan-400 font-bold rounded-xl border border-cyan-500/40 transition">RESTART</button>
                <button onclick="returnToMenu()" class="w-full py-3 bg-red-950/60 hover:bg-red-900/80 text-red-300 font-bold rounded-xl border border-red-500/40 transition">MAIN MENU</button>
            </div>
        </div>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="gameover-screen" class="absolute inset-0 z-30 hidden flex flex-col items-center justify-center bg-black/90 backdrop-blur-lg">
        <div class="neon-box-pink bg-black/95 p-10 rounded-2xl text-center max-w-md w-full">
            <h2 class="text-5xl font-black text-pink-500 mb-2 neon-text tracking-wider">CRASHED</h2>
            <p class="text-xs text-gray-400 uppercase tracking-widest mb-8">Simulation Terminated</p>
            
            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-gray-900/60 p-4 rounded-xl border border-cyan-500/30">
                    <div class="text-xs text-gray-400">Final Score</div>
                    <div id="go-score" class="text-2xl font-black text-white">0</div>
                </div>
                <div class="bg-gray-900/60 p-4 rounded-xl border border-yellow-500/30">
                    <div class="text-xs text-gray-400">Coins Collected</div>
                    <div id="go-coins" class="text-2xl font-black text-yellow-300">0</div>
                </div>
            </div>

            <div class="space-y-4">
                <button onclick="restartGame()" class="w-full py-4 bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-400 hover:to-purple-500 text-white font-black text-lg rounded-xl shadow-[0_0_20px_rgba(255,0,127,0.5)] transition transform hover:scale-105">
                    TRY AGAIN
                </button>
                <button onclick="returnToMenu()" class="w-full py-3 bg-gray-900 hover:bg-gray-800 text-cyan-400 font-bold rounded-xl border border-cyan-500/40 transition">
                    MAIN MENU
                </button>
            </div>
        </div>
    </div>

    <!-- Message notification box -->
    <div id="msg-box" class="fixed top-6 left-1/2 transform -translate-x-1/2 z-40 hidden bg-cyan-950/90 border border-cyan-400 px-6 py-3 rounded-xl text-cyan-300 text-sm font-bold shadow-[0_0_15px_rgba(0,243,255,0.5)] transition-opacity duration-300">
        Notification
    </div>

    <!-- AUDIO SYNTHESIZER ENGINE (Web Audio API) -->
    <script>
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
                this.engineOsc = null;
                this.engineGain = null;
                this.isInitialized = false;
            }

            init() {
                if (this.isInitialized) return;
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                    
                    // Engine hum oscillator
                    this.engineOsc = this.ctx.createOscillator();
                    this.engineOsc.type = 'sawtooth';
                    this.engineOsc.frequency.setValueAtTime(60, this.ctx.currentTime);
                    
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(300, this.ctx.currentTime);

                    this.engineGain = this.ctx.createGain();
                    this.engineGain.gain.setValueAtTime(0.05, this.ctx.currentTime);

                    this.engineOsc.connect(filter);
                    filter.connect(this.engineGain);
                    this.engineGain.connect(this.ctx.destination);
                    this.engineOsc.start();
                    this.isInitialized = true;
                } catch(e) {
                    console.log('Audio Context blocked or not supported');
                }
            }

            updateEnginePitch(speed, nitro) {
                if (!this.enabled || !this.ctx || !this.isInitialized) return;
                const freq = 50 + (speed * 1.2) + (nitro ? 40 : 0);
                this.engineOsc.frequency.setTargetAtTime(freq, this.ctx.currentTime, 0.1);
            }

            playCoin() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(987.77, this.ctx.currentTime); // B5
                osc.frequency.setValueAtTime(1318.51, this.ctx.currentTime + 0.08); // E6
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }

            playCrash() {
                if (!this.enabled || !this.ctx) return;
                // Noise buffer for crash explosion
                const bufferSize = this.ctx.sampleRate * 0.8;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(400, this.ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.8);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.8);

                noise.connect(filter);
                filter.connect(this.ctx.destination);
                noise.start();
            }

            playNitro() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);
            }

            toggle() {
                this.enabled = !this.enabled;
                if (this.engineGain) {
                    this.engineGain.gain.setValueAtTime(this.enabled ? 0.05 : 0, this.ctx.currentTime);
                }
                return this.enabled;
            }
        }

        const soundSystem = new SoundEngine();
    </script>

    <!-- MAIN GAME LOGIC -->
    <script>
        // Game States
        const STATE_MENU = 0;
        const STATE_PLAYING = 1;
        const STATE_PAUSED = 2;
        const STATE_GAMEOVER = 3;
        let gameState = STATE_MENU;

        // Configuration & Variables
        let selectedType = 'car'; // 'car' or 'bike'
        let score = 0;
        let coins = 0;
        let speed = 0;
        let maxSpeed = 180;
        let nitroAmount = 100;
        let isNitroActive = false;
        let laneIndex = 1; // 0: Left, 1: Center, 2: Right
        const lanePositions = [-3.5, 0, 3.5];

        let scene, camera, renderer;
        let playerVehicle;
        let roadMesh, gridHelper;
        let obstacles = [];
        let collectibles = [];
        let sceneryObjects = [];
        let particles = [];
        let clock = new THREE.Clock();

        // Keyboard tracking
        const keys = { left: false, right: false, nitro: false };

        // Notification popup helper
        function showMessage(text) {
            const box = document.getElementById('msg-box');
            box.innerText = text;
            box.classList.remove('hidden');
            setTimeout(() => {
                box.classList.add('hidden');
            }, 2000);
        }

        function selectVehicle(type) {
            selectedType = type;
            if (type === 'car') {
                document.getElementById('select-car').className = "neon-box px-8 py-4 rounded-xl bg-cyan-950/40 hover:bg-cyan-900/60 transition transform hover:scale-105 flex flex-col items-center group";
                document.getElementById('select-bike').className = "border border-gray-700 px-8 py-4 rounded-xl bg-gray-900/40 hover:bg-gray-800/60 transition transform hover:scale-105 flex flex-col items-center group opacity-70";
                showMessage("Sports Car Selected");
            } else {
                document.getElementById('select-bike').className = "neon-box-pink px-8 py-4 rounded-xl bg-pink-950/40 hover:bg-pink-900/60 transition transform hover:scale-105 flex flex-col items-center group";
                document.getElementById('select-car').className = "border border-gray-700 px-8 py-4 rounded-xl bg-gray-900/40 hover:bg-gray-800/60 transition transform hover:scale-105 flex flex-col items-center group opacity-70";
                showMessage("High-Speed Motorcycle Selected");
            }
        }

        // Initialize Three.js Scene
        function initScene() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x05050f);
            scene.fog = new THREE.FogExp2(0x05050f, 0.015);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x00f3ff, 1.2);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            const pinkLight = new THREE.PointLight(0xff007f, 2, 50);
            pinkLight.position.set(-10, 5, -10);
            scene.add(pinkLight);

            // Create Highway Road
            createRoad();

            // Setup Listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', onKeyDown);
            window.addEventListener('keyup', onKeyUp);

            // Touch support for mobile
            let touchStartX = 0;
            window.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
            });
            window.addEventListener('touchmove', (e) => {
                if (gameState !== STATE_PLAYING) return;
                let diffX = e.touches[0].clientX - touchStartX;
                if (Math.abs(diffX) > 40) {
                    if (diffX > 0 && laneIndex < 2) {
                        laneIndex++;
                        touchStartX = e.touches[0].clientX;
                    } else if (diffX < 0 && laneIndex > 0) {
                        laneIndex--;
                        touchStartX = e.touches[0].clientX;
                    }
                }
            });
        }

        function createRoad() {
            // Road surface
            const roadGeo = new THREE.PlaneGeometry(14, 1000);
            const roadMat = new THREE.MeshStandardMaterial({ 
                color: 0x111118, 
                roughness: 0.8,
                metalness: 0.2
            });
            roadMesh = new THREE.Mesh(roadGeo, roadMat);
            roadMesh.rotation.x = -Math.PI / 2;
            roadMesh.position.z = -400;
            scene.add(roadMesh);

            // Neon road borders & lane markings
            for (let i = -500; i < 200; i += 20) {
                // Left glowing neon line
                const lineGeo = new THREE.BoxGeometry(0.2, 0.1, 10);
                const cyanMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff });
                const leftStripe = new THREE.Mesh(lineGeo, cyanMat);
                leftStripe.position.set(-7, 0.05, i);
                scene.add(leftStripe);
                sceneryObjects.push(leftStripe);

                // Right glowing neon line
                const rightStripe = new THREE.Mesh(lineGeo, cyanMat);
                rightStripe.position.set(7, 0.05, i);
                scene.add(rightStripe);
                sceneryObjects.push(rightStripe);

                // Center dashed lines
                const dashMat = new THREE.MeshBasicMaterial({ color: 0xff007f });
                const dash1 = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.05, 6), dashMat);
                dash1.position.set(-1.15, 0.06, i);
                scene.add(dash1);
                sceneryObjects.push(dash1);

                const dash2 = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.05, 6), dashMat);
                dash2.position.set(1.15, 0.06, i);
                scene.add(dash2);
                sceneryObjects.push(dash2);

                // Side futuristic pillars / cyberpunk buildings
                createCityPillar(-14, i);
                createCityPillar(14, i);
            }
        }

        function createCityPillar(x, z) {
            const height = 20 + Math.random() * 30;
            const pillarGeo = new THREE.BoxGeometry(3, height, 3);
            const pillarMat = new THREE.MeshStandardMaterial({
                color: 0x0a0a16,
                roughness: 0.5,
                emissive: 0x020208
            });
            const pillar = new THREE.Mesh(pillarGeo, pillarMat);
            pillar.position.set(x, height / 2, z);
            scene.add(pillar);
            sceneryObjects.push(pillar);
        }

        // Build Player Model (Car or Motorcycle)
        function createPlayerModel() {
            if (playerVehicle) scene.remove(playerVehicle);

            playerVehicle = new THREE.Group();

            if (selectedType === 'car') {
                // Sports Car Body
                const bodyGeo = new THREE.BoxGeometry(1.8, 0.6, 3.8);
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, metalness: 0.8, roughness: 0.2 });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 0.5;
                playerVehicle.add(body);

                // Car Cabin roof
                const roofGeo = new THREE.BoxGeometry(1.4, 0.5, 2.0);
                const roofMat = new THREE.MeshStandardMaterial({ color: 0x050510, metalness: 0.9, roughness: 0.1 });
                const roof = new THREE.Mesh(roofGeo, roofMat);
                roof.position.set(0, 0.95, -0.2);
                playerVehicle.add(roof);

                // Neon glow underbody strip
                const glowGeo = new THREE.BoxGeometry(1.9, 0.1, 3.9);
                const glowMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff });
                const glow = new THREE.Mesh(glowGeo, glowMat);
                glow.position.y = 0.2;
                playerVehicle.add(glow);

                // Wheels
                const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.4, 16);
                wheelGeo.rotateZ(Math.PI / 2);
                const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
                
                [-1, 1].forEach(x => {
                    [-1.3, 1.3].forEach(z => {
                        const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                        wheel.position.set(x * 1.0, 0.35, z);
                        playerVehicle.add(wheel);
                    });
                });
            } else {
                // High-Speed Motorcycle
                const bodyGeo = new THREE.BoxGeometry(0.6, 0.7, 3.2);
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff007f, metalness: 0.8, roughness: 0.2 });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 0.6;
                playerVehicle.add(body);

                // Rider helmet/head
                const riderGeo = new THREE.SphereGeometry(0.3, 16, 16);
                const riderMat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, roughness: 0.3 });
                const rider = new THREE.Mesh(riderGeo, riderMat);
                rider.position.set(0, 1.2, -0.3);
                playerVehicle.add(rider);

                // Neon under glow
                const glowGeo = new THREE.BoxGeometry(0.7, 0.1, 3.3);
                const glowMat = new THREE.MeshBasicMaterial({ color: 0xff007f });
                const glow = new THREE.Mesh(glowGeo, glowMat);
                glow.position.y = 0.2;
                playerVehicle.add(glow);

                // Motorcycle Wheels
                const wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.3, 16);
                wheelGeo.rotateZ(Math.PI / 2);
                const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
                
                const frontWheel = new THREE.Mesh(wheelGeo, wheelMat);
                frontWheel.position.set(0, 0.45, 1.3);
                playerVehicle.add(frontWheel);

                const rearWheel = new THREE.Mesh(wheelGeo, wheelMat);
                rearWheel.position.set(0, 0.45, -1.3);
                playerVehicle.add(rearWheel);
            }

            playerVehicle.position.set(0, 0, 0);
            scene.add(playerVehicle);
        }

        // Obstacle & Traffic Generator
        function spawnTraffic() {
            if (gameState !== STATE_PLAYING) return;
            const lane = Math.floor(Math.random() * 3);
            const zPos = -300;

            const obstacleGroup = new THREE.Group();
            const colors = [0xff0055, 0x9900ff, 0x00ffcc, 0xffaa00];
            const randColor = colors[Math.floor(Math.random() * colors.length)];

            // Obstacle Vehicle body
            const obsGeo = new THREE.BoxGeometry(1.8, 0.8, 3.6);
            const obsMat = new THREE.MeshStandardMaterial({ color: randColor, metalness: 0.6, roughness: 0.3 });
            const obsMesh = new THREE.Mesh(obsGeo, obsMat);
            obsMesh.position.y = 0.5;
            obstacleGroup.add(obsMesh);

            obstacleGroup.position.set(lanePositions[lane], 0, zPos);
            scene.add(obstacleGroup);
            obstacles.push({ mesh: obstacleGroup, lane: lane, speed: 60 + Math.random() * 40 });
        }

        // Collectible Coin Generator
        function spawnCollectible() {
            if (gameState !== STATE_PLAYING) return;
            const lane = Math.floor(Math.random() * 3);
            const zPos = -300;

            const coinGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.15, 24);
            coinGeo.rotateX(Math.PI / 2);
            const coinMat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
            const coin = new THREE.Mesh(coinGeo, coinMat);
            coin.position.set(lanePositions[lane], 1.2, zPos);
            scene.add(coin);
            collectibles.push({ mesh: coin, lane: lane, type: 'coin' });
        }

        // Input Handlers
        function onKeyDown(e) {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'Space' || e.code === 'ArrowUp') keys.nitro = true;
        }

        function onKeyUp(e) {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'Space' || e.code === 'ArrowUp') keys.nitro = false;
        }

        let keyProcessedLeft = false;
        let keyProcessedRight = false;

        function handleInput() {
            if (keys.left) {
                if (!keyProcessedLeft) {
                    if (laneIndex > 0) laneIndex--;
                    keyProcessedLeft = true;
                }
            } else {
                keyProcessedLeft = false;
            }

            if (keys.right) {
                if (!keyProcessedRight) {
                    if (laneIndex < 2) laneIndex++;
                    keyProcessedRight = true;
                }
            } else {
                keyProcessedRight = false;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Game Flow Controls
        function startGame() {
            soundSystem.init();
            document.getElementById('menu-screen').classList.add('opacity-0');
            setTimeout(() => {
                document.getElementById('menu-screen').classList.add('hidden');
                document.getElementById('hud-screen').classList.remove('hidden');
            }, 500);

            createPlayerModel();
            score = 0;
            coins = 0;
            speed = 120;
            nitroAmount = 100;
            laneIndex = 1;
            obstacles.forEach(o => scene.remove(o.mesh));
            collectibles.forEach(c => scene.remove(c.mesh));
            obstacles = [];
            collectibles = [];

            gameState = STATE_PLAYING;

            // Spawners interval
            clearInterval(window.trafficInterval);
            clearInterval(window.coinInterval);
            window.trafficInterval = setInterval(spawnTraffic, 1400);
            window.coinInterval = setInterval(spawnCollectible, 1000);
        }

        function pauseGame() {
            if (gameState !== STATE_PLAYING) return;
            gameState = STATE_PAUSED;
            document.getElementById('pause-screen').classList.remove('hidden');
        }

        function resumeGame() {
            if (gameState !== STATE_PAUSED) return;
            document.getElementById('pause-screen').classList.add('hidden');
            gameState = STATE_PLAYING;
        }

        function restartGame() {
            document.getElementById('pause-screen').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');
            document.getElementById('hud-screen').classList.remove('hidden');
            startGame();
        }

        function returnToMenu() {
            clearInterval(window.trafficInterval);
            clearInterval(window.coinInterval);
            document.getElementById('pause-screen').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');
            document.getElementById('hud-screen').classList.add('hidden');
            const menu = document.getElementById('menu-screen');
            menu.classList.remove('hidden');
            setTimeout(() => menu.classList.remove('opacity-0'), 50);
            gameState = STATE_MENU;
        }

        function toggleSound() {
            const state = soundSystem.toggle();
            document.getElementById('sound-btn').innerText = state ? "AUDIO: ON" : "AUDIO: OFF";
        }

        function triggerGameOver() {
            gameState = STATE_GAMEOVER;
            soundSystem.playCrash();
            clearInterval(window.trafficInterval);
            clearInterval(window.coinInterval);
            document.getElementById('hud-screen').classList.add('hidden');
            document.getElementById('go-score').innerText = Math.floor(score);
            document.getElementById('go-coins').innerText = coins;
            document.getElementById('gameover-screen').classList.remove('hidden');
        }

        // Main Animation & Game Loop
        function animate() {
            requestAnimationFrame(animate);

            const dt = clock.getDelta();

            if (gameState === STATE_PLAYING) {
                handleInput();

                // Nitro and speed calculations
                isNitroActive = keys.nitro && nitroAmount > 0;
                if (isNitroActive) {
                    nitroAmount = Math.max(0, nitroAmount - dt * 35);
                    speed = Math.min(maxSpeed * 1.5, speed + dt * 80);
                    if (Math.random() < 0.2) soundSystem.playNitro();
                } else {
                    nitroAmount = Math.min(100, nitroAmount + dt * 10);
                    speed = Math.max(100, speed - dt * 20);
                }

                soundSystem.updateEnginePitch(speed, isNitroActive);

                // Smooth lane steering interpolation
                const targetX = lanePositions[laneIndex];
                playerVehicle.position.x += (targetX - playerVehicle.position.x) * 15 * dt;
                playerVehicle.rotation.z = (targetX - playerVehicle.position.x) * -0.15;

                // Score increment
                score += speed * dt * 0.1;

                // Move Scenery / Infinite Highway simulation
                const worldMove = speed * dt * 0.8;
                sceneryObjects.forEach(obj => {
                    obj.position.z += worldMove;
                    if (obj.position.z > 50) obj.position.z -= 300;
                });

                // Update Obstacles / Traffic
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    obs.mesh.position.z += (speed - obs.speed) * dt * 0.6;

                    // Collision detection with player
                    const dx = playerVehicle.position.x - obs.mesh.position.x;
                    const dz = playerVehicle.position.z - obs.mesh.position.z;
                    if (Math.abs(dx) < 1.2 && Math.abs(dz) < 2.5) {
                        triggerGameOver();
                    }

                    // Remove out of bounds
                    if (obs.mesh.position.z > 20) {
                        scene.remove(obs.mesh);
                        obstacles.splice(i, 1);
                    }
                }

                // Update Collectibles (Coins)
                for (let i = collectibles.length - 1; i >= 0; i--) {
                    const col = collectibles[i];
                    col.mesh.position.z += speed * dt * 0.8;
                    col.mesh.rotation.y += dt * 3;

                    // Collection detection
                    const dx = playerVehicle.position.x - col.mesh.position.x;
                    const dz = playerVehicle.position.z - col.mesh.position.z;
                    if (Math.abs(dx) < 1.2 && Math.abs(dz) < 2.0) {
                        coins++;
                        score += 500;
                        soundSystem.playCoin();
                        scene.remove(col.mesh);
                        collectibles.splice(i, 1);
                    } else if (col.mesh.position.z > 20) {
                        scene.remove(col.mesh);
                        collectibles.splice(i, 1);
                    }
                }

                // Smooth camera chase following player
                camera.position.x += (playerVehicle.position.x * 0.4 - camera.position.x) * 5 * dt;
                camera.position.y = 3.5 + (isNitroActive ? Math.sin(Date.now() * 0.05) * 0.1 : 0);
                camera.position.z = playerVehicle.position.z + 6;
                camera.lookAt(playerVehicle.position.x * 0.2, playerVehicle.position.y + 0.8, playerVehicle.position.z - 3);

                // Update HUD Elements
                document.getElementById('hud-score').innerText = Math.floor(score).toString().padStart(6, '0');
                document.getElementById('hud-coins').innerText = coins;
                document.getElementById('hud-speed').innerText = Math.floor(speed);
                document.getElementById('hud-nitro-bar').style.width = nitroAmount + '%';
            }

            renderer.render(scene, camera);
        }

        window.onload = function() {
            initScene();
            animate();
        };
    </script>
</body>
</html>
